<!DOCTYPE html>
<html lang="en">
<body>
    <input type="text" id="studentName">
    <button onclick="savedData()">save</button>

    <button onclick="getData()">getData</button>
    <p id="result"></p>
    <script>
        function savedData() {
            let name = 
            document.getElementById(
                "studentName"
            ).value;    
            localStorage.setItem(
                "student",
                name
        );
        alert("Data saved");
        }
        function getData() { 
            let student =
            localStorage.getItem(
                "student"
            );
            Document
            .getElementById("result")
            .innerHTML = student            
        }
    </script>
</body>
</html>
